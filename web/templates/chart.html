<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Chart — Trading Signal System</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #30363d;
      --green:   #3fb950;
      --blue:    #58a6ff;
      --muted:   #8b949e;
      --text:    #e6edf3;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    header .brand {
      font-size: 1rem;
      font-weight: 700;
      color: var(--blue);
    }

    nav {
      display: flex;
      gap: 1.5rem;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: .88rem;
      transition: color .2s;
    }

    nav a:hover {
      color: var(--text);
    }

    nav a.active {
      color: var(--blue);
      font-weight: 700;
    }

    /* ── Controls ── */
    .controls {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .control-group label {
      font-size: .85rem;
      color: var(--muted);
      font-weight: 600;
    }

    select, .btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: .85rem;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }

    select:hover, .btn:hover {
      border-color: var(--blue);
      background: rgba(88, 166, 255, 0.1);
    }

    select:focus, .btn:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
    }

    .btn {
      padding: 0.5rem 1rem;
      font-weight: 600;
      border: 1px solid var(--blue);
      color: var(--blue);
    }

    .btn.active {
      background: var(--blue);
      color: #fff;
    }

    /* ── Chart Container ── */
    .chart-container {
      flex: 1;
      padding: 1.5rem;
      overflow: hidden;
    }

    #chart {
      width: 100%;
      height: 100%;
      min-height: 500px;
    }

    /* ── Status ── */
    .status {
      padding: 0.5rem 1.5rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: .8rem;
      color: var(--muted);
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Responsive */
    @media (max-width: 768px) {
      header, .controls {
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        flex-wrap: wrap;
      }

      .control-group {
        width: 100%;
      }

      select, .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<header>
  <span class="brand">📈 Signal System</span>
  <nav>
    <a href="/">Home</a>
    <a href="/signals">Signals</a>
    <a href="/chart" class="active">Chart</a>
    <a href="/payments">Payments</a>
    <a href="/chat">Chat</a>
  </nav>
</header>

<div class="controls">
  <div class="control-group">
    <label>Symbol:</label>
    <select id="symbolSelect">
      <option value="EURUSD">EUR/USD</option>
      <option value="GBPUSD">GBP/USD</option>
      <option value="USDJPY">USD/JPY</option>
      <option value="AUDUSD">AUD/USD</option>
      <option value="USDCHF">USD/CHF</option>
      <option value="USDCAD">USD/CAD</option>
      <option value="NZDUSD">NZD/USD</option>
      <option value="BTCUSD">BTC/USD</option>
      <option value="ETHUSD">ETH/USD</option>
    </select>
  </div>

  <div class="control-group">
    <label>Timeframe:</label>
    <div style="display: flex; gap: 0.5rem;">
      <button class="btn" data-tf="M1">M1</button>
      <button class="btn" data-tf="M5">M5</button>
      <button class="btn" data-tf="M15">M15</button>
      <button class="btn active" data-tf="H1">H1</button>
      <button class="btn" data-tf="D1">D1</button>
    </div>
  </div>

  <div class="control-group" style="margin-left: auto;">
    <button class="btn" id="refreshBtn">🔄 Refresh</button>
  </div>
</div>

<div class="chart-container">
  <div id="chart"></div>
</div>

<div class="status">
  <span class="status-dot"></span>
  <span id="statusText">Loading chart...</span>
</div>

<script>
  // ── Configuration ──────────────────────────────────────────────────────────
  const DEFAULT_SYMBOL = "EURUSD";
  const DEFAULT_TIMEFRAME = "H1";
  const POLL_INTERVAL = 8000; // 8 seconds

  // ── DOM Elements ───────────────────────────────────────────────────────────
  const symbolSelect = document.getElementById("symbolSelect");
  const timeframeButtons = document.querySelectorAll("[data-tf]");
  const refreshBtn = document.getElementById("refreshBtn");
  const statusText = document.getElementById("statusText");
  const chartContainer = document.getElementById("chart");

  // ── State ──────────────────────────────────────────────────────────────────
  let currentSymbol = DEFAULT_SYMBOL;
  let currentTimeframe = DEFAULT_TIMEFRAME;
  let isLoading = false;
  let pollTimer = null;

  // ── Chart Setup ────────────────────────────────────────────────────────────
  const chart = LightweightCharts.createChart(chartContainer, {
    width: chartContainer.clientWidth,
    height: chartContainer.clientHeight,
    layout: {
      background: { color: "#0d1117" },
      textColor: "#e6edf3",
    },
    grid: {
      vertLines: { color: "#30363d" },
      hLines: { color: "#30363d" },
    },
    timeScale: {
      timeVisible: true,
      secondsVisible: false,
    },
  });

  const candleSeries = chart.addCandlestickSeries({
    upColor: "#3fb950",
    downColor: "#f85149",
    borderUpColor: "#3fb950",
    borderDownColor: "#f85149",
    wickUpColor: "#3fb950",
    wickDownColor: "#f85149",
  });

  // ── Functions ──────────────────────────────────────────────────────────────
  async function loadCandles() {
    if (isLoading) return;
    isLoading = true;
    statusText.textContent = "Loading...";

    try {
      const url = `/api/candles?symbol=${currentSymbol}&tf=${currentTimeframe}&limit=200`;
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const data = await response.json();

      if (Array.isArray(data) && data.length > 0) {
        candleSeries.setData(data);
        chart.timeScale().fitContent();
        statusText.textContent = `${currentSymbol} • ${currentTimeframe} • ${data.length} candles • Updated just now`;
      } else {
        statusText.textContent = "No data available";
      }
    } catch (error) {
      console.error("Chart load error:", error);
      statusText.textContent = `⚠️ Error: ${error.message}`;
    } finally {
      isLoading = false;
    }
  }

  function setTimeframe(tf) {
    currentTimeframe = tf;
    timeframeButtons.forEach(btn => {
      btn.classList.toggle("active", btn.dataset.tf === tf);
    });
    clearInterval(pollTimer);
    loadCandles();
    startPolling();
  }

  function startPolling() {
    pollTimer = setInterval(loadCandles, POLL_INTERVAL);
  }

  function stopPolling() {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  // ── Event Listeners ────────────────────────────────────────────────────────
  symbolSelect.addEventListener("change", (e) => {
    currentSymbol = e.target.value;
    loadCandles();
  });

  timeframeButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      setTimeframe(btn.dataset.tf);
    });
  });

  refreshBtn.addEventListener("click", loadCandles);

  window.addEventListener("resize", () => {
    const width = chartContainer.clientWidth;
    const height = chartContainer.clientHeight;
    chart.applyOptions({ width, height });
  });

  // ── Cleanup ────────────────────────────────────────────────────────────────
  window.addEventListener("beforeunload", stopPolling);

  // ── Initialize ─────────────────────────────────────────────────────────────
  loadCandles();
  startPolling();
</script>

</body>
</html>
